default_install_hook_types: [pre-commit, commit-msg]
repos:
  - repo: https://git.hzqlab.cn/github/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, chore, test, docs, build, ci]

  - repo: https://git.hzqlab.cn/github/ruff-pre-commit
    rev: v0.12.12
    hooks:
      - id: ruff-check
        files: 'src'
        args: [ --fix ]
        stages: [pre-commit]
      - id: ruff-format
        files: 'src'
        stages: [pre-commit]

  - repo: https://git.hzqlab.cn/github/basedpyright-prek-mirror
    rev: 1.32.1
    hooks:
      - id: basedpyright
        files: 'src'
        stages: [pre-commit]
