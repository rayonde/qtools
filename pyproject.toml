[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtools"
version = "0.1.0"
description = "A quantitative and developer tools package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yifan Li", email = "antoineli1994@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "qutip>=5.0.0",
    "scipy>=1.10.0",
    "tomli-w>=1.2.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
