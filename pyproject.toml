[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qtools"
version = "0.1.0"
description = "A quantitative and developer tools package"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Yifan Li", email = "antoineli1994@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "configargparse>=1.7",
    "h5py>=3.0",
    "imageio[tifffile]>=2.37.3",
    "kochen",
    "matplotlib>=3.5.0",
    "numpy>=1.24.0",
    "pillow>=12.3.0",
    "pyserial>=3.5",
    "qutip>=5.0.0",
    "s15lib>=0.2.0",
    "scipy>=1.10.0",
    "tomli-w>=1.2.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "tqdm>=4.66",
]

[project.optional-dependencies]
slm-display = ["pyside6-essentials"]
slm-rpc = ["ipyutils>=1.0.0"]
slm-simulated = ["slmsuite>=0.4.1"]

[project.scripts]
tdc = "qtools.tdc.cli:main"
tec = "qtools.tec.cli:main"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qtools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "hardware: tests that require real TDC hardware connected",
]
